<!doctype html>
<!-- Creator: <dinesh_blend360_india> <dinesh.marre@blend360.com> -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="dinesh_blend360_india (dinesh.marre@blend360.com)">
  <title>Blend Logo Animation</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 633px);
      text-align: center;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      margin: auto;
      overflow: visible;
    }
    .letter { fill: #0a3358; fill-rule: evenodd; }
    .symbol path {
      fill: none;
      stroke: #0a3358;
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
      visibility: hidden;
    }
    .trademark {
      fill: #0a3358;
      font: 17px Arial, Helvetica, sans-serif;
      opacity: 0;
    }
  </style>
  <noscript>
    <style>
      .letter-clip rect { width: 100%; }
      .symbol path { visibility: visible; stroke-dasharray: none !important; stroke-dashoffset: 0 !important; }
      .trademark { opacity: 1; }
    </style>
  </noscript>
</head>
<body>
  <main>
    <svg id="logo" viewBox="0 0 633 177" role="img" aria-label="Blend logo" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="clip-b" class="letter-clip"><rect x="18" y="60" width="0" height="78" /></clipPath>
        <clipPath id="clip-l" class="letter-clip"><rect x="99" y="60" width="0" height="78" /></clipPath>
        <clipPath id="clip-e" class="letter-clip"><rect x="117" y="60" width="0" height="78" /></clipPath>
        <clipPath id="clip-n" class="letter-clip"><rect x="200" y="60" width="0" height="78" /></clipPath>
        <clipPath id="clip-d" class="letter-clip"><rect x="280" y="60" width="0" height="78" /></clipPath>
      </defs>

      <!-- Letter outlines are drawn to the proportions of the supplied reference. -->
      <path class="letter" clip-path="url(#clip-b)"
        d="M 18 69 H 62 C 81 69 91 77 91 88 C 91 97 85 102 77 104 C 88 106 95 111 95 120 C 95 132 84 136 64 136 H 18 Z
           M 31 79 V 100 H 62 C 73 100 79 96 79 89 C 79 82 73 79 62 79 Z
           M 31 109 V 126 H 65 C 77 126 83 124 83 118 C 83 112 77 109 65 109 Z" />
      <path class="letter" clip-path="url(#clip-l)" d="M 100 61 H 112 V 136 H 100 Z" />
      <path class="letter" clip-path="url(#clip-e)"
        d="M 118 108 C 118 91 135 79 157 79 C 179 79 195 91 195 110 H 130 C 132 121 143 127 157 127 C 170 127 180 123 187 117 L 195 124 C 185 133 172 137 157 137 C 134 137 118 125 118 108 Z
           M 130 101 H 182 C 178 93 168 89 157 89 C 145 89 135 93 130 101 Z" />
      <path class="letter" clip-path="url(#clip-n)"
        d="M 201 81 H 213 V 91 C 221 83 231 79 244 79 C 264 79 276 89 276 106 V 136 H 264 V 107 C 264 95 257 89 244 89 C 227 89 213 99 213 111 V 136 H 201 Z" />
      <path class="letter" clip-path="url(#clip-d)"
        d="M 346 61 H 358 V 136 H 346 V 126 C 339 133 329 137 317 137 C 296 137 281 125 281 108 C 281 91 296 79 317 79 C 329 79 339 83 346 91 Z
           M 294 108 C 294 120 305 127 319 127 C 334 127 346 119 346 108 C 346 97 334 89 319 89 C 305 89 294 96 294 108 Z" />

      <g class="symbol">
        <path data-start="300" data-duration="350"
          d="M 398 99 L 398 82 C 398 62 439 49 488 49 C 536 49 579 62 579 82 C 579 89 573 96 563 99" />
        <path data-start="650" data-duration="350"
          d="M 563 99 C 574 103 580 111 580 118 C 580 139 538 151 489 151 C 440 151 398 139 398 118 L 398 99" />
        <path data-start="1000" data-duration="250"
          d="M 411 99 C 454 76 520 76 563 99" />
        <path data-start="1250" data-duration="250"
          d="M 563 99 C 520 123 454 123 411 99" />
      </g>
      <text class="trademark" x="577" y="57">TM</text>
    </svg>
  </main>

  <script>
    (() => {
      const svg = document.getElementById('logo');
      const clips = [
        ['clip-b', 77], ['clip-l', 15], ['clip-e', 79],
        ['clip-n', 78], ['clip-d', 80]
      ].map(([id, width]) => ({ rect: svg.querySelector(`#${id} rect`), width }));
      const paths = [...svg.querySelectorAll('.symbol path')].map(path => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}px ${length}px`;
        path.style.strokeDashoffset = `${length}px`;
        path.style.visibility = 'visible';
        return { path, length, start: Number(path.dataset.start), duration: Number(path.dataset.duration) };
      });
      const trademark = svg.querySelector('.trademark');
      let startedAt;

      const progress = (time, start, duration) => Math.min(1, Math.max(0, (time - start) / duration));
      const ease = value => value * value * (3 - 2 * value);

      function render(elapsed) {
        clips.forEach(({ rect, width }, index) => {
          rect.setAttribute('width', width * ease(progress(elapsed, index * 60, 60)));
        });
        paths.forEach(({ path, length, start, duration }) => {
          path.style.strokeDashoffset = `${length * (1 - ease(progress(elapsed, start, duration)))}px`;
        });
        trademark.style.opacity = progress(elapsed, 1500, 250);
      }

      function tick(now) {
        if (startedAt === undefined) startedAt = now;
        render((now - startedAt) % 3000);
        requestAnimationFrame(tick);
      }
      render(0);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
